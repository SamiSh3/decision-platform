services:
  db:
    image: postgres:16-alpine
    container_name: decision_platform_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-decision_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-decision_password}
      POSTGRES_DB: ${POSTGRES_DB:-decision_platform}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-decision_user} -d ${POSTGRES_DB:-decision_platform}"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: decision_platform_api
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-decision_user}:${POSTGRES_PASSWORD:-decision_password}@db:5432/${POSTGRES_DB:-decision_platform}
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./backend:/srv/backend
    command: ["uvicorn", "app.main:app", "--app-dir", "backend", "--host", "0.0.0.0", "--port", "8000", "--reload"]

volumes:
  postgres_data:
